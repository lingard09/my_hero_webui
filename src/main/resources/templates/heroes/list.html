<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <h1>영웅 목록</h1>
    <a th:href="@{/heroes/new}" class="btn btn-primary">새 영웅 등록</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>역할군</th>
                <th>체력</th>
                <th>국적</th>
                <th>성별</th>
            </tr>
        </thead>
        <tbody>
        <tr th:each="hero : ${heroes}">
            <td th:text="${hero.id}"></td>
            <td th:text="${hero.name}"></td>
            <td th:text="${hero.role}"></td>
            <td th:text="${hero.health}"></td>
            <td th:text="${hero.nationality}"></td>
            <td th:text="${hero.gender}"></td>
        </tr>
        </tbody>
    </table>

</body>
</html>
